workflows:
  ios_unsigned_check:
    name: iOS unsigned build check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          ls -la ios/Runner.xcodeproj/xcshareddata/xcschemes
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Drift code
        script: dart run build_runner build
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios_signed_ipa:
    name: iOS signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - initialcert
        provisioning_profiles:
          - demoprofile
      vars:
        BUNDLE_ID: com.chrismusic.clangMusic
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Drift code
        script: dart run build_runner build
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
